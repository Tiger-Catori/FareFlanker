spring.application.name=app-backend
server.port=8081

# Frankfurter API for currency conversion
frankfurter.api.base-url=https://api.frankfurter.dev/v2/

# Hibernate: create tables from entities
spring.jpa.hibernate.ddl-auto=create

# Very important: Run Hibernate schema creation BEFORE data scripts
spring.jpa.defer-datasource-initialization=true

# Data initialization: always run the INSERT scripts
spring.sql.init.mode=always
spring.sql.init.data-locations=\
  classpath:database/insert_airlines.sql,\
  classpath:database/insert_airports.sql,\
  classpath:database/insert_flights.sql,\
  classpath:database/insert_flight_prices.sql